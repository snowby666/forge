# Dex OIDC provider config for self-hosted Daytona.
# Default login: dev@daytona.io / password
issuer: http://localhost:5556/dex
storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556
  allowedOrigins: ['*']
  allowedHeaders: ['x-requested-with']

staticClients:
  - id: daytona
    redirectURIs:
      - 'http://localhost:3986'
      - 'http://localhost:3986/api/oauth2-redirect.html'
      - 'http://localhost:3009/callback'
      - 'http://proxy.localhost:4000/callback'
    name: 'Daytona'
    public: true

enablePasswordDB: true
staticPasswords:
  - email: 'dev@daytona.io'
    hash: '$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W'
    username: 'admin'
    userID: '1234'
