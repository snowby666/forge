# Forge — Docker Compose stack
# Reads .env from this directory automatically (no more config/ vs root mismatch).
# Run: docker compose up -d
#
# Data volumes use Docker named volumes (not bind mounts) so that services like
# PostgreSQL can chmod/chown freely. This is required on WSL2/NTFS where bind
# mounts to /mnt/c/ don't support Unix permissions.

services:
  postgres:
    image: postgres:16-alpine
    container_name: forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backbone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: backbone
    volumes:
      - forge-postgres-data:/var/lib/postgresql/data
      - ./config/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backbone}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forge-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-change_me}
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --appendonly yes
      --appendfsync everysec
      --save "60 100"
      --save "300 1"
      --tcp-keepalive 60
    volumes:
      - forge-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: forge-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-change_me}
    volumes:
      - forge-qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    # Official qdrant/qdrant image has NO curl/wget (debian-slim + static binary only). CMD-SHELL uses /bin/sh;
    # curl healthchecks always fail → permanently "unhealthy" and block forge-api (depends_on: service_healthy).
    # Use bash's /dev/tcp + raw HTTP (bash is present — entrypoint.sh is #!/usr/bin/env bash).
    # When QDRANT__SERVICE__API_KEY is set, /readyz requires the api-key header.
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 || exit 1; if [ -n "$$QDRANT__SERVICE__API_KEY" ]; then printf $$'GET /readyz HTTP/1.1\r\nHost: localhost\r\napi-key: %s\r\nConnection: close\r\n\r\n' "$$QDRANT__SERVICE__API_KEY" >&3; else printf $$'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; fi; IFS= read -r line <&3 || exit 1; [[ "$$line" == *" 200 "* ]] || exit 1
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 15s

  n8n:
    image: n8nio/n8n:latest
    container_name: forge-n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-change_me}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      GENERIC_TIMEZONE: UTC
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-backbone}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      N8N_AI_OPENAI_API_KEY: ${ELECTRONHUB_API_KEY:-not_set}
      N8N_AI_OPENAI_BASE_URL: ${ELECTRONHUB_BASE_URL:-https://api.electronhub.ai/v1}
    volumes:
      - forge-n8n-data:/home/node/.n8n
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/auto-setup:latest
    container_name: forge-temporal
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-backbone}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig.yaml
    volumes:
      - ./config/temporal-dynamicconfig.yaml:/etc/temporal/dynamicconfig.yaml:ro
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    container_name: forge-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"
    depends_on:
      - temporal

  # ── Forge API backend (FastAPI) ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: forge-api
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:-change_me}@redis:6379/0"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-backbone}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/backbone"
      FORGE_WEB_TOKEN: "${FORGE_WEB_TOKEN:-}"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_API_KEY: "${QDRANT_API_KEY:-change_me}"
      QDRANT_CLIENT_TIMEOUT: "${QDRANT_CLIENT_TIMEOUT:-120}"
      SEARXNG_URL: "http://searxng:8080"
      DAYTONA_API_URL: "http://daytona-api:3000/api"
      DAYTONA_API_KEY: "${DAYTONA_API_KEY:-}"
      BROWSER_SERVER_URL: "${BROWSER_DOCKER_URL:-http://host.docker.internal:3100}"
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # ── Forge web dashboard — Next.js (sentinelhive.dev) ───────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: forge-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: "http://api:3001"
      FORGE_WEB_TOKEN: "${FORGE_WEB_TOKEN:-}"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || wget -qO- http://localhost:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      api:
        condition: service_healthy

  # ── SearXNG self-hosted metasearch (ForgeSearch) ──────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: forge-searxng
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-forge-searxng-secret-change-this}
    volumes:
      - forge-searxng-data:/etc/searxng
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis

volumes:
  forge-postgres-data:
  forge-redis-data:
  forge-qdrant-data:
  forge-n8n-data:
  forge-searxng-data:

networks:
  default:
    name: forge-network
