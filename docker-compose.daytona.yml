# Daytona self-hosted sandbox infrastructure.
# Provides isolated build environments for frontend_engineer and backend_engineer agents.
#
# Prerequisites: the main Forge stack must be running first (creates forge-network).
#   docker compose up -d                          # start Forge stack
#   docker compose -f docker-compose.daytona.yml up -d  # start Daytona
#
# Dashboard: http://localhost:3986  (login: dev@daytona.io / password)
# After login, generate an API key and set DAYTONA_API_KEY in .env.

services:
  daytona-api:
    image: daytonaio/daytona-api
    container_name: daytona-api
    restart: unless-stopped
    ports:
      - "3986:3000"
    env_file:
      - ./docker/daytona/ssh-keys.env
    environment:
      - OTEL_ENABLED=false
      - DEFAULT_SNAPSHOT=daytonaio/sandbox:0.5.0-slim
      - ENCRYPTION_KEY=${DAYTONA_ENCRYPTION_KEY:-daytona-forge-secret}
      - ENCRYPTION_SALT=${DAYTONA_ENCRYPTION_SALT:-daytona-forge-salt}
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=daytona-db
      - DB_PORT=5432
      - DB_USERNAME=daytona
      - DB_PASSWORD=daytona
      - DB_DATABASE=daytona
      - REDIS_HOST=daytona-redis
      - REDIS_PORT=6379
      - OIDC_CLIENT_ID=daytona
      - OIDC_ISSUER_BASE_URL=http://daytona-dex:5556/dex
      - PUBLIC_OIDC_DOMAIN=http://localhost:5556/dex
      - OIDC_AUDIENCE=daytona
      - OIDC_MANAGEMENT_API_ENABLED=
      - OIDC_MANAGEMENT_API_CLIENT_ID=
      - OIDC_MANAGEMENT_API_CLIENT_SECRET=
      - OIDC_MANAGEMENT_API_AUDIENCE=
      - DASHBOARD_URL=http://localhost:3986/dashboard
      - DASHBOARD_BASE_API_URL=http://localhost:3986
      - POSTHOG_API_KEY=
      - POSTHOG_HOST=
      - POSTHOG_ENVIRONMENT=local
      - TRANSIENT_REGISTRY_URL=http://daytona-registry:6000
      - TRANSIENT_REGISTRY_ADMIN=admin
      - TRANSIENT_REGISTRY_PASSWORD=password
      - TRANSIENT_REGISTRY_PROJECT_ID=daytona
      - INTERNAL_REGISTRY_URL=http://daytona-registry:6000
      - INTERNAL_REGISTRY_ADMIN=admin
      - INTERNAL_REGISTRY_PASSWORD=password
      - INTERNAL_REGISTRY_PROJECT_ID=daytona
      - SMTP_HOST=
      - SMTP_PORT=
      - SMTP_USER=
      - SMTP_PASSWORD=
      - SMTP_SECURE=
      - SMTP_EMAIL_FROM=
      - S3_ENDPOINT=http://daytona-minio:9000
      - S3_STS_ENDPOINT=http://daytona-minio:9000/minio/v1/assume-role
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_DEFAULT_BUCKET=daytona
      - S3_ACCOUNT_ID=/
      - S3_ROLE_NAME=/
      - ENVIRONMENT=docker-compose
      - MAX_AUTO_ARCHIVE_INTERVAL=43200
      - MAINTENANCE_MODE=false
      - PROXY_DOMAIN=proxy.localhost:4000
      - PROXY_PROTOCOL=http
      - PROXY_API_KEY=super_secret_key
      - PROXY_TEMPLATE_URL=http://{{PORT}}-{{sandboxId}}.proxy.localhost:4000
      - DEFAULT_RUNNER_DOMAIN=daytona-runner:3003
      - DEFAULT_RUNNER_API_URL=http://daytona-runner:3003
      - DEFAULT_RUNNER_PROXY_URL=http://daytona-runner:3003
      - DEFAULT_RUNNER_API_KEY=secret_api_token
      - DEFAULT_RUNNER_CPU=4
      - DEFAULT_RUNNER_MEMORY=8
      - DEFAULT_RUNNER_DISK=50
      - DEFAULT_RUNNER_NAME=default
      - DEFAULT_REGION_ID=us
      - DEFAULT_REGION_NAME=us
      - DEFAULT_REGION_ENFORCE_QUOTAS=false
      - DEFAULT_ORG_QUOTA_TOTAL_CPU_QUOTA=10000
      - DEFAULT_ORG_QUOTA_TOTAL_MEMORY_QUOTA=10000
      - DEFAULT_ORG_QUOTA_TOTAL_DISK_QUOTA=100000
      - DEFAULT_ORG_QUOTA_MAX_CPU_PER_SANDBOX=100
      - DEFAULT_ORG_QUOTA_MAX_MEMORY_PER_SANDBOX=100
      - DEFAULT_ORG_QUOTA_MAX_DISK_PER_SANDBOX=1000
      - DEFAULT_ORG_QUOTA_SNAPSHOT_QUOTA=1000
      - DEFAULT_ORG_QUOTA_MAX_SNAPSHOT_SIZE=1000
      - DEFAULT_ORG_QUOTA_VOLUME_QUOTA=10000
      - SSH_GATEWAY_API_KEY=ssh_secret_api_token
      - SSH_GATEWAY_COMMAND=ssh -p 2222 {{TOKEN}}@localhost
      - SSH_GATEWAY_PUBLIC_KEY=${SSH_PUBLIC_KEY:-}
      - SSH_GATEWAY_URL=localhost:2222
      - SKIP_USER_EMAIL_VERIFICATION=true
      - RUN_MIGRATIONS=true
      - HEALTH_CHECK_API_KEY=supersecretkey
    privileged: true
    depends_on:
      - daytona-db
      - daytona-runner
      - daytona-redis
      - daytona-dex
      - daytona-registry
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  daytona-proxy:
    image: daytonaio/daytona-proxy
    container_name: daytona-proxy
    restart: unless-stopped
    environment:
      - DAYTONA_API_URL=http://daytona-api:3000/api
      - PROXY_PORT=4000
      - PROXY_API_KEY=super_secret_key
      - PROXY_PROTOCOL=http
      - OIDC_CLIENT_ID=daytona
      - OIDC_CLIENT_SECRET=
      - OIDC_DOMAIN=http://daytona-dex:5556/dex
      - OIDC_PUBLIC_DOMAIN=http://localhost:5556/dex
      - OIDC_AUDIENCE=daytona
      - REDIS_HOST=daytona-redis
      - REDIS_PORT=6379
      - TOOLBOX_ONLY_MODE=false
      - PREVIEW_WARNING_ENABLED=false
    ports:
      - "4000:4000"

  daytona-runner:
    image: daytonaio/daytona-runner
    container_name: daytona-runner
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - API_PORT=3003
      - DAYTONA_RUNNER_TOKEN=secret_api_token
      - LOG_FILE_PATH=/home/daytona/runner/runner.log
      - RESOURCE_LIMITS_DISABLED=true
      - AWS_ENDPOINT_URL=http://daytona-minio:9000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_BUCKET=daytona
      - DAYTONA_API_URL=http://daytona-api:3000/api
      - RUNNER_DOMAIN=daytona-runner
      - SSH_GATEWAY_ENABLE=true
      - SSH_PUBLIC_KEY=${SSH_PUBLIC_KEY:-}
      - INTER_SANDBOX_NETWORK_ENABLED=false
    env_file:
      - ./docker/daytona/ssh-keys.env
    ports:
      - "3003:3003"
    privileged: true

  daytona-ssh-gateway:
    image: daytonaio/daytona-ssh-gateway
    container_name: daytona-ssh-gateway
    restart: unless-stopped
    environment:
      - API_URL=http://daytona-api:3000/api
      - API_KEY=ssh_secret_api_token
      - SSH_PRIVATE_KEY=${DAYTONA_SSH_PRIVATE_KEY:-}
      - SSH_HOST_KEY=${DAYTONA_SSH_HOST_KEY:-}
      - SSH_GATEWAY_PORT=2222
    ports:
      - "2222:2222"

  daytona-dex:
    image: dexidp/dex:v2.42.0
    container_name: daytona-dex
    volumes:
      - ./docker/daytona/dex-config.yaml:/etc/dex/config.yaml:ro
      - daytona-dex-db:/var/dex
    entrypoint: ['sh', '-c', 'touch /var/dex/dex.db && exec dex serve /etc/dex/config.yaml']
    ports:
      - "5556:5556"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:5556/dex/.well-known/openid-configuration"]
      interval: 15s
      timeout: 5s
      retries: 5

  daytona-db:
    image: postgres:16-alpine
    container_name: daytona-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: daytona
      POSTGRES_USER: daytona
      POSTGRES_DB: daytona
    volumes:
      - daytona-db-data:/var/lib/postgresql/data

  daytona-redis:
    image: redis:7-alpine
    container_name: daytona-redis
    restart: unless-stopped

  daytona-registry:
    image: registry:2.8.2
    container_name: daytona-registry
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
      REGISTRY_HTTP_ADDR: 0.0.0.0:6000
    volumes:
      - daytona-registry-data:/var/lib/registry
    ports:
      - "6000:6000"

  daytona-minio:
    image: minio/minio:latest
    container_name: daytona-minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - daytona-minio-data:/data
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"

volumes:
  daytona-db-data:
  daytona-dex-db:
  daytona-registry-data:
  daytona-minio-data:

networks:
  default:
    name: forge-network
    external: true
