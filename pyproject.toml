[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tell hatchling where to find the Python source.
# Forge is not a traditional package directory — agents/ and config/ are the source.
[tool.hatch.build.targets.wheel]
packages = ["agents", "config"]

[tool.hatch.build.targets.sdist]
include = ["agents", "config", "scripts", "tests", "forge", "*.md", "*.toml", "*.example"]

[project]
name = "forge"
version = "2.0.0"
description = "Forge -- autonomous hackathon agent swarm"
requires-python = ">=3.11"

dependencies = [
    "openai>=1.54.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=0.0.10",
    "langchain-openai>=0.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "mem0ai>=0.1.0",
    "qdrant-client>=1.12.0",
    "redis[asyncio]>=5.2.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    # ── ForgeSearch dependencies ──────────────────────────────────────────────
    "ddgs>=8.0.0",                        # Free metasearch (DDG/Bing/Google)
    "bm25s>=0.2.0",                        # Fast BM25 keyword retrieval
    # NOTE: sentence-transformers (+ PyTorch ~2GB) installed separately by setup.sh
    # with graceful BM25 fallback. Kept out of core deps to avoid 10+ min installs.
    # ── Google Calendar (service account) ────────────────────────────────────
    "google-auth>=2.0.0",
    "google-api-python-client>=2.0.0",
    # ── Other agents ─────────────────────────────────────────────────────────
    "aiohttp>=3.11.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "playwright>=1.48.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
]

# Heavy optional deps — installed separately to avoid wheel availability issues
# on Python 3.13+. Run: pip install -e ".[gpu]" on Linux servers with CUDA.
# Run: pip install -e ".[full]" to get everything.
[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]
embeddings = [
    "sentence-transformers>=3.0.0",        # Semantic reranking (pulls in PyTorch)
]
gpu = [
    # PyTorch — install the right variant for your hardware:
    #   CPU-only:  pip install torch --index-url https://download.pytorch.org/whl/cpu
    #   CUDA 12.x: pip install torch --index-url https://download.pytorch.org/whl/cu121
    # Listed here for documentation; not installed automatically.
    "torch>=2.3.0",
]
crawl = [
    "crawl4ai>=0.4.0",                    # JS rendering, adaptive crawl, structured extraction
]
temporal = [
    "temporalio>=1.7.0",                  # Temporal workflow orchestration (Linux/WSL recommended)
]
daytona = [
    "daytona-sdk>=0.10.0",               # Daytona sandbox SDK (Linux/WSL only)
]
calendar = [
    "google-auth-oauthlib>=1.0.0",        # Only needed for OAuth browser flow (not service account)
]
tts = [
    "edge-tts>=6.1.0",                   # Text-to-speech for demo narration
    "readmeai>=0.5.0",                    # README generation
]
full = [
    "forge[embeddings,gpu,crawl,temporal,daytona,tts,calendar]",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
forge = "forge:main"

