[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge"
version = "2.0.0"
description = "Forge — autonomous hackathon agent swarm"
requires-python = ">=3.11"

dependencies = [
    "openai>=1.54.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=0.0.10",
    "langchain-openai>=0.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "mem0ai>=0.1.0",
    "qdrant-client[async]>=1.12.0",
    "redis[asyncio]>=5.2.0",
    "asyncpg>=0.30.0",
    "temporalio>=1.7.0",
    "aiohttp>=3.11.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "playwright>=1.48.0",
    "readmeai>=0.5.0",
    "edge-tts>=6.1.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "daytona-sdk>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
forge = "forge:main"
