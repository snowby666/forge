# NOTE: Copy .env.example to .env and fill in passwords before running `docker compose up`
# version: field is obsolete in Compose v2 -- removed to suppress the warning
#
# Data volumes use Docker named volumes (not bind mounts) so that services like
# PostgreSQL can chmod/chown freely. This is required on WSL2/NTFS where bind
# mounts to /mnt/c/ don't support Unix permissions.

services:
  postgres:
    image: postgres:16-alpine
    container_name: forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backbone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: backbone
    volumes:
      - forge-postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backbone}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forge-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-change_me}
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
      --appendonly yes
      --appendfsync everysec
      --save "60 100"
      --save "300 1"
      --tcp-keepalive 60
    volumes:
      - forge-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: forge-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-change_me}
    volumes:
      - forge-qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: forge-n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-change_me}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      GENERIC_TIMEZONE: UTC
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-backbone}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      N8N_AI_OPENAI_API_KEY: ${ELECTRONHUB_API_KEY:-not_set}
      N8N_AI_OPENAI_BASE_URL: ${ELECTRONHUB_BASE_URL:-https://api.electronhub.ai/v1}
    volumes:
      - forge-n8n-data:/home/node/.n8n
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/auto-setup:latest
    container_name: forge-temporal
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-backbone}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig.yaml
    volumes:
      - ./temporal-dynamicconfig.yaml:/etc/temporal/dynamicconfig.yaml:ro
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    container_name: forge-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"
    depends_on:
      - temporal

  # ── SearXNG self-hosted metasearch (ForgeSearch) ──────────────────────────
  # Queries 70+ engines simultaneously (Google, Bing, DDG, Startpage...). Free.
  # Set SEARXNG_URL=http://searxng:8081 in forge.secrets to enable.
  # Uses port 8081 to avoid conflict with temporal-ui on 8080.
  searxng:
    image: searxng/searxng:latest
    container_name: forge-searxng
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-forge-searxng-secret-change-this}
    volumes:
      - forge-searxng-data:/etc/searxng
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
    # Uses the default network -- no custom network needed

volumes:
  forge-postgres-data:
  forge-redis-data:
  forge-qdrant-data:
  forge-n8n-data:
  forge-searxng-data:

networks:
  default:
    name: forge-network
