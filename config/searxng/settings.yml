use_default_settings: true

general:
  instance_name: "Forge Search"
  debug: false

search:
  safe_search: 0
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "forge-searxng-secret-key"
  limiter: false
  image_proxy: false
  public_instance: false
  method: "GET"

ui:
  static_use_hash: true

outgoing:
  request_timeout: 15.0
  max_request_timeout: 30.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20
  # To add webshare proxies, run: python scripts/update_searxng_proxies.py
  # Then restart SearXNG: docker compose restart searxng

enabled_plugins:
  - 'Hash plugin'
  - 'Self Information'
  - 'Tracker URL remover'
  - 'Hostname replace'

engines:
  # ── Disabled engines ──
  - name: duckduckgo
    engine: duckduckgo
    disabled: true
  - name: duckduckgo images
    engine: duckduckgo_extra
    disabled: true
  - name: duckduckgo videos
    engine: duckduckgo_extra
    disabled: true
  - name: duckduckgo news
    engine: duckduckgo_extra
    disabled: true
  - name: duckduckgo weather
    engine: duckduckgo_weather
    disabled: true
  - name: duckduckgo definitions
    engine: duckduckgo_definitions
    disabled: true
  - name: wikipedia
    engine: wikipedia
    disabled: true
  # ── Tuned engines ──
  - name: brave
    engine: brave
    disabled: false
    timeout: 15.0
    send_accept_language_header: true
  - name: google
    engine: google
    disabled: false
    timeout: 15.0
  - name: bing
    engine: bing
    disabled: false
    timeout: 15.0
  - name: startpage
    engine: startpage
    disabled: false
    timeout: 15.0
